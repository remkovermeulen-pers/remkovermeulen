<style>
:root {
  --bg:          #fbf9f8;
  --bg-card:     #ffffff;
  --bg-elev:     #efeded;
  --primary:     #1b1c1c;
  --on-primary:  #ffffff;
  --muted:       #444748;
  --muted-2:     #65645f;
  --muted-3:     #87847a;
  --line:        rgba(27,28,28,0.12);
  --accent:      #A68B77;
  --font-display:'Fraunces',Georgia,serif;
  --font-body:   'Hanken Grotesk','Inter',system-ui,sans-serif;
  --pad-desktop: 64px;
  --pad-mobile:  20px;
}
*,*::before,*::after { box-sizing:border-box; }
html,body { margin:0; padding:0; }
body {
  background:var(--bg); color:var(--primary);
  font-family:var(--font-body); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
img { display:block; max-width:100%; }
a { color:inherit; text-decoration:none; }
button { font:inherit; cursor:pointer; background:none; border:0; color:inherit; }
.container { max-width:1280px; margin:0 auto; padding:0 var(--pad-desktop); }
@media (max-width:760px) { .container { padding:0 var(--pad-mobile); } }

.accent-mark { display:inline-block; width:7px; height:7px; background:var(--accent); margin-right:12px; vertical-align:1px; }
.label-xs { font-size:11px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; line-height:1; color:var(--muted-2); }

/* NAV */
.site-nav { position:sticky; top:0; z-index:50; background:var(--bg); border-bottom:1px solid var(--line); }
.site-nav__inner { display:flex; align-items:center; justify-content:space-between; height:76px; }
.site-nav__brand { font-family:var(--font-display); font-weight:700; font-size:22px; letter-spacing:-0.01em; }
.site-nav__links { display:flex; align-items:center; gap:36px; }
.site-nav__link { font-size:13px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted-2); padding-bottom:4px; transition:color .2s; }
.site-nav__link:hover { color:var(--primary); }
.site-nav__link.is-active { color:var(--primary); font-weight:600; border-bottom:1px solid var(--primary); }
.site-nav__cta { background:var(--primary); color:var(--on-primary); padding:12px 22px; font-size:11px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; border:1px solid var(--primary); transition:box-shadow .2s, transform .2s; }
.site-nav__cta:hover { box-shadow:4px 4px 0 0 var(--primary); transform:translate(-2px,-2px); }
.site-nav__burger { display:none; width:36px; height:36px; align-items:center; justify-content:center; border:1px solid var(--primary); }
.site-nav__burger span,.site-nav__burger span::before,.site-nav__burger span::after { display:block; width:16px; height:1.5px; background:var(--primary); position:relative; }
.site-nav__burger span::before { content:''; position:absolute; top:-5px; left:0; width:100%; height:100%; background:var(--primary); }
.site-nav__burger span::after  { content:''; position:absolute; top:5px;  left:0; width:100%; height:100%; background:var(--primary); }
@media (max-width:760px) {
  .site-nav__inner { height:60px; }
  .site-nav__brand { font-size:18px; }
  .site-nav__links { display:none; }
  .site-nav__links.is-open {
    display:flex; flex-direction:column; gap:20px;
    position:absolute; top:60px; left:0; right:0;
    background:var(--bg); border-bottom:1px solid var(--line);
    padding:20px var(--pad-mobile); z-index:49;
  }

  .site-nav__cta { padding:9px 14px; font-size:10px; letter-spacing:0.14em; }
  .site-nav__burger { display:inline-flex; }
}

/* FOOTER */
.site-footer { background:#1b1c1c; color:#ffffff; margin-top:72px; }
.site-footer__inner { display:flex; align-items:center; justify-content:space-between; padding-top:40px; padding-bottom:40px; gap:24px; flex-wrap:wrap; }
.site-footer__brand { font-family:var(--font-display); font-weight:700; font-size:22px; letter-spacing:-0.01em; }
.site-footer__copy { font-size:13px; color:rgba(255,255,255,0.5); font-style:italic; }
.site-footer__links { display:flex; gap:28px; }
.site-footer__link { font-size:11px; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:rgba(255,255,255,0.5); transition:color .2s; }
.site-footer__link:hover { color:#ffffff; }
@media (max-width:760px) {
  .site-footer { margin-top:60px; }
  .site-footer__inner { padding-top:28px; padding-bottom:28px; flex-direction:column; align-items:flex-start; gap:18px; }
}

/* HERO */
.work-hero { padding:56px 0 48px; display:grid; grid-template-columns:1.5fr 1fr; gap:56px; align-items:end; }
.work-hero__eyebrow { font-size:11px; font-weight:700; letter-spacing:0.22em; text-transform:uppercase; color:var(--muted-2); margin:0 0 24px; display:flex; align-items:center; }
.work-hero h1 { font-family:var(--font-display); font-weight:700; font-size:clamp(32px,4vw,56px); line-height:1.1; letter-spacing:-0.02em; margin:0; }
.work-hero__intro { border-left:1px solid var(--line); padding:0 0 0 28px; font-size:17px; line-height:1.6; color:var(--muted); max-width:460px; }
@media (max-width:880px) {
  .work-hero { grid-template-columns:1fr; gap:28px; padding:40px 0 48px; }
  .work-hero__intro { padding-left:0; border-left:none; border-top:1px solid var(--line); padding-top:20px; }
}

/* SECTION HEADER */
.sec-head { display:flex; align-items:baseline; justify-content:space-between; border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:24px; gap:18px; }
.sec-head__title { display:flex; align-items:center; }
.sec-head__title h2 { margin:0; font-family:var(--font-display); font-style:italic; font-weight:600; font-size:clamp(22px,2.8vw,30px); letter-spacing:0.02em; text-transform:uppercase; }

/* ARTICLES GRID */
.journal-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
.article-card { display:flex; flex-direction:column; justify-content:space-between; padding:24px; background:var(--bg-card); border:1px solid var(--accent); min-height:240px; gap:16px; transition:transform .3s, box-shadow .3s; }
.article-card:hover { transform:translate(-3px,-3px); box-shadow:6px 6px 0 0 var(--primary); }
.article-card__tag { font-size:10px; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:var(--accent); }
.article-card h3 { margin:14px 0; font-family:var(--font-display); font-weight:600; font-size:clamp(20px,1.8vw,26px); line-height:1.2; }
.article-card__year { align-self:flex-end; font-size:11px; font-weight:600; letter-spacing:0.18em; color:var(--muted-2); }
@media (max-width:880px) {
  .journal-grid { grid-template-columns:1fr; }
  .article-card { min-height:0; padding:26px; }
}

/* FILTER BAR */
.filter-bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px; }
.filter-chip { display:inline-block; padding:7px 14px; font-size:10px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted-2); border:1px solid var(--line); line-height:1; cursor:pointer; background:none; transition:color .2s, border-color .2s, background .2s; }
.filter-chip:hover { color:var(--accent); border-color:var(--accent); }
.filter-chip.is-active { color:var(--on-primary); background:var(--primary); border-color:var(--primary); }
</style>

<body>

<header class="site-nav">
  <div class="container site-nav__inner">
    <a href="index.html" class="site-nav__brand">Remko Vermeulen</a>
    <nav class="site-nav__links">
      <a href="work.html" class="site-nav__link">Work</a>
      <a href="articles.html" class="site-nav__link is-active">Articles</a>
      <a href="/about.html" class="site-nav__link">About</a>
    </nav>
    <div style="display:flex;align-items:center;gap:14px;">
      <a href="https://linkedin.com/in/remkovermeulen" class="site-nav__cta">Get in touch</a>
      <button class="site-nav__burger" aria-label="Menu"><span></span></button>
    </div>
  </div>
</header>

<main class="container">

  <section class="work-hero">
    <div>
      <p class="work-hero__eyebrow"><span class="accent-mark"></span>Writing</p>
      <h1>Articles</h1>
    </div>
    <p class="work-hero__intro">
      Thoughts on product management, innovation, and building great teams.
    </p>
  </section>

  <section>
    <div style="display:flex;justify-content:flex-end;margin-bottom:16px;">
      <span class="label-xs" id="article-count"></span>
    </div>

    <div class="filter-bar" id="filter-bar"></div>
    <div class="journal-grid" id="journal-grid">
      <!-- populated by JS from data/articles.json -->
    </div>
    <script>
    (function(){
      function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
      function slugify(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
      fetch('data/articles.json')
        .then(function(r){ return r.json(); })
        .then(function(articles){
          var grid = document.getElementById('journal-grid');
          var filterBar = document.getElementById('filter-bar');
          var count = document.getElementById('article-count');
          if (!grid) return;

          grid.innerHTML = articles.map(function(a){
            var href = a.notionId ? 'article.html?slug=' + slugify(a.title) : esc(a.url || '#');
            var target = a.notionId ? '' : ' target="_blank" rel="noopener"';
            var rt = a.readingTime ? a.readingTime + ' min' : a.year;
            return '<a href="' + href + '"' + target + ' class="article-card" data-category="' + esc(a.category) + '">'
              + '<div><span class="article-card__tag">' + esc(a.category) + '</span>'
              + '<h3>' + esc(a.title) + '</h3></div>'
              + '<span class="article-card__year">' + esc(String(rt)) + '</span>'
              + '</a>';
          }).join('');

          // Collect unique categories in order of first appearance
          var allCats = [];
          articles.forEach(function(a){
            if (a.category && allCats.indexOf(a.category) === -1) allCats.push(a.category);
          });

          if (filterBar && allCats.length) {
            filterBar.innerHTML = ['All'].concat(allCats).map(function(cat){
              return '<button class="filter-chip' + (cat === 'All' ? ' is-active' : '') + '" data-cat="' + esc(cat) + '">' + esc(cat) + '</button>';
            }).join('');

            function applyFilter(cat) {
              filterBar.querySelectorAll('.filter-chip').forEach(function(chip){
                chip.classList.toggle('is-active', chip.dataset.cat === cat);
              });
              var cards = grid.querySelectorAll('.article-card');
              var shown = 0;
              cards.forEach(function(card){
                var show = cat === 'All' || card.dataset.category === cat;
                card.style.display = show ? '' : 'none';
                if (show) shown++;
              });
              if (count) count.textContent = cat === 'All'
                ? articles.length + ' Articles'
                : shown + ' of ' + articles.length + ' Articles';
            }

            filterBar.addEventListener('click', function(e){
              var chip = e.target.closest('.filter-chip');
              if (!chip) return;
              applyFilter(chip.dataset.cat);
              var url = new URL(location.href);
              if (chip.dataset.cat === 'All') { url.searchParams.delete('category'); }
              else { url.searchParams.set('category', chip.dataset.cat); }
              history.replaceState(null, '', url);
            });

            var urlCat = new URLSearchParams(location.search).get('category');
            if (urlCat && allCats.indexOf(urlCat) !== -1) applyFilter(urlCat);
            else applyFilter('All');
          }

          if (count) count.textContent = articles.length + ' Articles';
        })
        .catch(function(){});
    })();
    </script>
  </section>

</main>

  var b=document.querySelector('.site-nav__burger');

})();
