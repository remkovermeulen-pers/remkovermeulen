<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Study — Remko Vermeulen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:          #fbf9f8;
  --bg-card:     #ffffff;
  --bg-elev:     #efeded;
  --primary:     #1b1c1c;
  --on-primary:  #ffffff;
  --muted:       #444748;
  --muted-2:     #65645f;
  --muted-3:     #87847a;
  --line:        rgba(27,28,28,0.12);
  --accent:      #A68B77;
  --font-display:'DM Serif Display','Playfair Display',Georgia,serif;
  --font-body:   'Hanken Grotesk','Inter',system-ui,sans-serif;
  --pad-desktop: 64px;
  --pad-mobile:  20px;
}
*,*::before,*::after { box-sizing:border-box; }
html,body { margin:0; padding:0; }
body {
  background:var(--bg); color:var(--primary);
  font-family:var(--font-body); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
img { display:block; max-width:100%; }
a { color:inherit; text-decoration:none; }
button { font:inherit; cursor:pointer; background:none; border:0; color:inherit; }
.container { max-width:1280px; margin:0 auto; padding:0 var(--pad-desktop); }
@media (max-width:760px) { .container { padding:0 var(--pad-mobile); } }

.metric { font-family:var(--font-body); font-weight:600; font-size:clamp(32px,4.5vw,56px); color:var(--accent); letter-spacing:-0.01em; line-height:1; display:block; margin-bottom:12px; }
.metric-label { font-size:10px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted-2); line-height:1.5; }
.bw-img { filter:grayscale(100%) contrast(108%); transition:filter .6s cubic-bezier(.22,1,.36,1); }
.bw-img:hover { filter:grayscale(0%) contrast(105%); }
.tag { display:inline-block; padding:7px 12px; font-size:10px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:var(--accent); border:1px solid var(--accent); line-height:1; }
.btn { display:inline-flex; align-items:center; gap:10px; padding:16px 28px; font-size:11px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; border:1px solid var(--primary); background:var(--bg-card); color:var(--primary); transition:box-shadow .25s, transform .25s; }
.btn:hover { box-shadow:4px 4px 0 0 var(--primary); transform:translate(-2px,-2px); }

/* NAV */
.site-nav { position:sticky; top:0; z-index:50; background:var(--bg); border-bottom:1px solid var(--line); }
.site-nav__inner { display:flex; align-items:center; justify-content:space-between; height:76px; }
.site-nav__brand { font-family:var(--font-display); font-weight:700; font-size:22px; letter-spacing:-0.01em; }
.site-nav__links { display:flex; align-items:center; gap:36px; }
.site-nav__link { font-size:13px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted-2); padding-bottom:4px; transition:color .2s; }
.site-nav__link:hover { color:var(--primary); }
.site-nav__link.is-active { color:var(--primary); font-weight:600; border-bottom:1px solid var(--primary); }
.site-nav__cta { background:var(--primary); color:var(--on-primary); padding:12px 22px; font-size:11px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; border:1px solid var(--primary); transition:box-shadow .2s, transform .2s; }
.site-nav__cta:hover { box-shadow:4px 4px 0 0 var(--primary); transform:translate(-2px,-2px); }
.site-nav__burger { display:none; width:36px; height:36px; align-items:center; justify-content:center; border:1px solid var(--primary); }
.site-nav__burger span,.site-nav__burger span::before,.site-nav__burger span::after { display:block; width:16px; height:1.5px; background:var(--primary); position:relative; }
.site-nav__burger span::before { content:''; position:absolute; top:-5px; left:0; width:100%; height:100%; background:var(--primary); }
.site-nav__burger span::after  { content:''; position:absolute; top:5px;  left:0; width:100%; height:100%; background:var(--primary); }
@media (max-width:760px) {
  .site-nav__inner { height:60px; }
  .site-nav__brand { font-size:18px; }
  .site-nav__links { display:none; }
  .site-nav__cta { padding:9px 14px; font-size:10px; letter-spacing:0.14em; }
  .site-nav__burger { display:inline-flex; }
}

/* FOOTER */
.site-footer { background:#1b1c1c; color:#ffffff; margin-top:96px; }
.site-footer__inner { display:flex; align-items:center; justify-content:space-between; padding:40px 0; gap:24px; flex-wrap:wrap; }
.site-footer__brand { font-family:var(--font-display); font-weight:700; font-size:22px; letter-spacing:-0.01em; }
.site-footer__copy { font-size:13px; color:rgba(255,255,255,0.5); font-style:italic; }
.site-footer__links { display:flex; gap:28px; }
.site-footer__link { font-size:11px; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:rgba(255,255,255,0.5); transition:color .2s; }
.site-footer__link:hover { color:#ffffff; }
@media (max-width:760px) {
  .site-footer { margin-top:60px; }
  .site-footer__inner { padding:28px 0; flex-direction:column; align-items:flex-start; gap:18px; }
}

/* PROJECT PAGER */
.proj-pager { border-bottom:1px solid var(--line); padding:18px 0; display:grid; grid-template-columns:1fr auto 1fr; gap:24px; align-items:center; }
.proj-pager__link { display:inline-flex; align-items:center; gap:14px; color:var(--primary); text-decoration:none; transition:color .2s; }
.proj-pager__link:hover { color:var(--accent); }
.proj-pager__link--next { justify-self:end; text-align:right; }
.proj-pager__arrow { width:36px; height:36px; border:1px solid var(--primary); display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .25s, color .25s, transform .25s; }
.proj-pager__link:hover .proj-pager__arrow { background:var(--primary); color:var(--on-primary); }
.proj-pager__link--prev:hover .proj-pager__arrow { transform:translateX(-3px); }
.proj-pager__link--next:hover .proj-pager__arrow { transform:translateX(3px); }
.proj-pager__meta { display:flex; flex-direction:column; gap:4px; line-height:1.2; }
.proj-pager__label { font-size:10px; font-weight:700; letter-spacing:0.22em; text-transform:uppercase; color:var(--muted-2); }
.proj-pager__title { font-family:var(--font-display); font-weight:600; font-size:16px; color:var(--primary); letter-spacing:-0.01em; }
.proj-pager__index { font-family:var(--font-display); font-style:italic; font-size:13px; color:var(--muted-2); letter-spacing:0.04em; padding:0 8px; white-space:nowrap; }
@media (max-width:760px) { .proj-pager__index, .proj-pager__meta { display:none; } }
@media (max-width:760px) {
  .proj-pager { grid-template-columns:1fr 1fr; gap:14px; padding:14px 0; }
  .proj-pager__index { display:none; }
  .proj-pager__title { font-size:13px; }
  .proj-pager__arrow { width:32px; height:32px; }
  .proj-pager__link { gap:10px; }
}

/* CASE STUDY HERO */
.cs-hero { padding:64px 0 48px; }
.cs-hero__crumb { font-size:11px; font-weight:700; letter-spacing:0.22em; text-transform:uppercase; color:var(--muted-2); margin:0 0 28px; }
.cs-hero h1 { margin:0 0 24px; font-family:var(--font-display); font-weight:700; font-size:clamp(40px,6.5vw,84px); line-height:1.04; letter-spacing:-0.025em; max-width:980px; }
.cs-hero__lede { margin:0; font-size:clamp(17px,1.6vw,20px); line-height:1.55; color:var(--muted); max-width:720px; }
.cs-hero__byline { margin-top:36px; padding-top:28px; border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(3,1fr); gap:40px; align-items:flex-start; max-width:880px; }
.cs-hero__byline-block h5 { margin:0 0 14px; font-size:10px; font-weight:700; letter-spacing:0.22em; text-transform:uppercase; color:var(--muted-2); }
.cs-hero__byline-block .metric { font-size:clamp(36px,4.4vw,56px); margin-bottom:10px; }
.cs-hero__byline-block p { margin:0; font-size:13px; line-height:1.55; color:var(--muted-2); max-width:260px; }
@media (max-width:760px) { .cs-hero__byline { grid-template-columns:1fr; gap:28px; } }

.cs-cover { margin-top:48px; border:1px solid var(--primary); overflow:hidden; position:relative; }
.cs-cover img { width:100%; height:clamp(280px,42vw,560px); object-fit:cover; }
.cs-cover__logo { position:absolute; bottom:24px; left:32px; height:36px; max-width:160px; width:auto; object-fit:contain; filter:brightness(0) invert(1); opacity:0.9; pointer-events:none; }
.cs-cover__caption { padding:14px 20px; border-top:1px solid var(--line); font-size:12px; color:var(--muted-2); font-style:italic; background:var(--bg-card); }

/* BODY GRID */
.cs-body { margin-top:96px; display:grid; grid-template-columns:220px 1fr; gap:48px; }
.cs-aside { position:sticky; top:100px; align-self:start; }
.cs-aside h4 { font-size:10px; font-weight:700; letter-spacing:0.22em; text-transform:uppercase; color:var(--muted-2); margin:0 0 14px; padding-bottom:14px; border-bottom:1px solid var(--line); }
.cs-aside .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:36px; }
.cs-aside__meta { display:flex; flex-direction:column; gap:22px; }
.cs-aside__meta-block h5 { margin:0 0 6px; font-size:10px; font-weight:700; letter-spacing:0.22em; text-transform:uppercase; color:var(--muted-2); }
.cs-aside__meta-block p { margin:0; font-family:var(--font-display); font-weight:500; font-size:18px; line-height:1.25; color:var(--primary); }

/* SIDEBAR TOC */
.cs-toc { list-style:none; margin:0 0 36px; padding:0; display:flex; flex-direction:column; gap:14px; }
.cs-toc li { display:flex; align-items:baseline; gap:12px; }
.cs-toc__num { font-family:var(--font-display); font-style:italic; font-size:14px; color:var(--accent); min-width:18px; }
.cs-toc a { font-size:13px; color:var(--muted); line-height:1.45; transition:color .2s; }
.cs-toc a:hover { color:var(--primary); }

/* CONTENT */
.cs-content { display:flex; flex-direction:column; gap:96px; }
.cs-section { max-width:760px; }
.cs-section__head { display:flex; align-items:baseline; gap:18px; margin-bottom:28px; }
.cs-section__num { font-family:var(--font-display); font-style:italic; font-weight:500; font-size:30px; color:var(--accent); }
.cs-section h2 { margin:0; font-family:var(--font-display); font-weight:600; font-size:clamp(28px,3.6vw,42px); line-height:1.1; letter-spacing:-0.01em; }
.cs-section p { margin:0 0 22px; font-size:17px; line-height:1.7; color:var(--muted); }
.cs-section p:last-child { margin-bottom:0; }
.cs-section ul, .cs-section ol { margin:0 0 22px; padding-left:24px; }
.cs-section li { font-size:17px; line-height:1.7; color:var(--muted); margin-bottom:10px; }
.cs-section li:last-child { margin-bottom:0; }
.cs-section strong { color:var(--primary); font-weight:600; }

.cs-metrics-row { margin-top:56px; padding-top:36px; border-top:1px solid var(--line); display:flex; gap:64px; flex-wrap:wrap; }
.cs-metric .metric { font-size:clamp(48px,5.6vw,80px); margin-bottom:16px; }
.cs-metric p { font-size:14px; max-width:280px; margin:0; color:var(--muted-2); line-height:1.55; }

@media (max-width:880px) {
  .cs-body { grid-template-columns:1fr; gap:36px; margin-top:48px; }
  .cs-aside { position:static; }
  .cs-content { gap:72px; }
  .cs-metrics-row { gap:36px; flex-direction:column; }
}

/* NEXT PROJECT */
.next-proj { margin-top:128px; padding-top:56px; border-top:1px solid var(--primary); }
.next-proj__eyebrow { font-size:11px; font-weight:700; letter-spacing:0.22em; text-transform:uppercase; color:var(--muted-2); margin:0 0 28px; }
.next-proj__card { display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--primary); overflow:hidden; transition:transform .3s, box-shadow .3s; }
.next-proj__card:hover { transform:translate(-3px,-3px); box-shadow:6px 6px 0 0 var(--primary); }
.next-proj__card img { width:100%; height:100%; aspect-ratio:16/10; object-fit:cover; }
.next-proj__text { padding:48px; display:flex; flex-direction:column; justify-content:center; background:var(--bg); gap:14px; }
.next-proj__text .tag-line { font-size:10px; font-weight:700; letter-spacing:0.22em; text-transform:uppercase; color:var(--accent); }
.next-proj__text h3 { margin:0; font-family:var(--font-display); font-weight:600; font-size:clamp(26px,3.2vw,38px); line-height:1.15; display:flex; align-items:center; gap:16px; }
.next-proj__text p { margin:0; font-size:14px; color:var(--muted-2); letter-spacing:0.02em; }
.next-proj__text svg { transition:transform .3s; }
.next-proj__card:hover .next-proj__text svg { transform:translateX(8px); }
@media (max-width:880px) {
  .next-proj { margin-top:72px; padding-top:36px; }
  .next-proj__card { grid-template-columns:1fr; }
  .next-proj__text { padding:28px; }
}

/* LOADING / ERROR */
.cs-loading { padding:120px 0; text-align:center; font-size:14px; color:var(--muted-2); letter-spacing:0.1em; }
</style>
</head>
<body>

<header class="site-nav">
  <div class="container site-nav__inner">
    <a href="index.html" class="site-nav__brand">Remko Vermeulen</a>
    <nav class="site-nav__links">
      <a href="work.html" class="site-nav__link is-active">Work</a>
      <a href="articles.html" class="site-nav__link">Articles</a>
      <a href="about.html" class="site-nav__link">About</a>
      <a href="mailto:vermeulenremko@gmail.com" class="site-nav__link">Contact</a>
    </nav>
    <div style="display:flex;align-items:center;gap:14px;">
      <a href="mailto:vermeulenremko@gmail.com" class="site-nav__cta">Get in touch</a>
      <button class="site-nav__burger" aria-label="Menu"><span></span></button>
    </div>
  </div>
</header>

<main class="container" id="cs-main">
  <div class="cs-loading">Loading…</div>
</main>

<footer class="site-footer">
  <div class="container site-footer__inner">
    <div class="site-footer__brand">RV.</div>
    <div class="site-footer__copy">© 2025 Remko Vermeulen. Built with intention.</div>
    <div class="site-footer__links">
      <a href="https://linkedin.com/in/remkovermeulen" class="site-footer__link">LinkedIn</a>
      <a href="https://github.com/remkovermeulen-pers" class="site-footer__link">GitHub</a>
      <a href="mailto:vermeulenremko@gmail.com" class="site-footer__link">Email</a>
    </div>
  </div>
</footer>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var id = params.get('id');
  if (!id) { location.href = 'work.html'; return; }

  var main = document.getElementById('cs-main');

  Promise.all([
    fetch('data/projects/' + id + '.json').then(function(r){ return r.json(); }),
    fetch('data/projects.json').then(function(r){ return r.json(); })
  ]).then(function(results) {
    var proj = results[0];
    var all  = results[1];
    render(proj, all);
  }).catch(function() {
    main.innerHTML = '<div class="cs-loading">Project not found. <a href="work.html">Back to work</a></div>';
  });

  function render(proj, all) {
    document.title = proj.title + ' — Case Study — Remko Vermeulen';

    var nextProj    = getNext(proj.id, all);
    var prevProj    = getPrev(proj.id, all);
    var sectionsHtml = buildSections(proj.sections);
    var sidebarHtml  = buildSidebar(proj);
    var nextHtml     = buildNext(nextProj);
    var pagerHtml    = buildPager(proj, prevProj, nextProj, all);
    var bylineHtml   = buildByline(proj.metrics);

    // Use Description field if set, otherwise derive full lede from first section body
    var ledeText = proj.description || '';
    if (!ledeText && proj.sections && proj.sections.length) {
      var tmpDiv = document.createElement('div');
      tmpDiv.innerHTML = proj.sections[0].body;
      ledeText = tmpDiv.textContent.trim();
    }
    if (!ledeText) ledeText = proj.lede;

    main.innerHTML =
      pagerHtml +

      '<section class="cs-hero">' +
        '<p class="cs-hero__crumb">' + esc(proj.sector) + ' &nbsp;/&nbsp; Case Study</p>' +
        '<h1>' + esc(proj.title) + '</h1>' +
        '<p class="cs-hero__lede">' + esc(ledeText) + '</p>' +
        bylineHtml +
        '<div class="cs-cover">' +
          '<img class="bw-img" src="' + esc(proj.coverImage) + '" alt="' + esc(proj.title) + '">' +
          (proj.logoDomain ? '<img class="cs-cover__logo" src="https://cdn.brandfetch.io/' + esc(proj.logoDomain) + '/w/400/h/200/logo?theme=dark" alt="">' : '') +
          (proj.coverCaption ? '<div class="cs-cover__caption">' + esc(proj.coverCaption) + '</div>' : '') +
        '</div>' +
      '</section>' +

      '<div class="cs-body">' +
        '<aside class="cs-aside">' + sidebarHtml + '</aside>' +
        '<article class="cs-content">' + sectionsHtml + '</article>' +
      '</div>' +

      nextHtml;
  }

  function buildSections(sections) {
    return sections.map(function(sec, i) {
      var num = String(i + 1).padStart(2, '0');
      var anchor = sec.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
      return '<section class="cs-section" id="' + anchor + '">' +
        '<div class="cs-section__head">' +
          '<span class="cs-section__num">' + num + '</span>' +
          '<h2>' + esc(sec.title) + '</h2>' +
        '</div>' +
        sec.body +
      '</section>';
    }).join('');
  }

  function buildMetrics(metrics) {
    if (!metrics || !metrics.length) return '';
    var items = metrics.map(function(m) {
      return '<div class="cs-metric">' +
        '<span class="metric">' + esc(m.value) + '</span>' +
        '<p>' + esc(m.label) + '</p>' +
      '</div>';
    }).join('');
    return '<div class="cs-metrics-row">' + items + '</div>';
  }

  function buildSidebar(proj) {
    var chips = (proj.tags || []).map(function(t) {
      return '<span class="tag">' + esc(t) + '</span>';
    }).join('');

    var meta = '';
    if (proj.role) {
      meta += '<div class="cs-aside__meta-block"><h5>Role</h5><p>' + esc(proj.role) + '</p></div>';
    }
    if (proj.timeline) {
      meta += '<div class="cs-aside__meta-block"><h5>Timeline</h5><p>' + esc(proj.timeline) + '</p></div>';
    }
    if (proj.partners && proj.partners.length) {
      var partnersText = proj.partners.join('<br>');
      meta += '<div class="cs-aside__meta-block"><h5>Partners</h5><p>' + partnersText + '</p></div>';
    }

    var toc = '';
    if (proj.sections && proj.sections.length) {
      var tocItems = proj.sections.map(function(sec, i) {
        var num = String(i + 1).padStart(2, '0');
        var anchor = sec.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
        return '<li><span class="cs-toc__num">' + num + '</span><a href="#' + anchor + '">' + esc(sec.title) + '</a></li>';
      }).join('');
      toc = '<h4>Contents</h4><ol class="cs-toc">' + tocItems + '</ol>';
    }

    return toc +
           (chips ? '<h4>Tags</h4><div class="chips">' + chips + '</div>' : '') +
           (meta ? '<div class="cs-aside__meta">' + meta + '</div>' : '');
  }

  function buildNext(next) {
    if (!next) return '';
    return '<section class="next-proj">' +
      '<p class="next-proj__eyebrow">Next Project</p>' +
      '<a href="case-study?id=' + esc(next.notionId) + '" class="next-proj__card">' +
        '<img class="bw-img" src="' + esc(next.coverImage || 'https://images.unsplash.com/photo-1531482615713-2afd69097998?w=1200&q=80') + '" alt="' + esc(next.title) + '">' +
        '<div class="next-proj__text">' +
          (next.sector ? '<span class="tag-line">' + esc(next.sector) + '</span>' : '') +
          '<h3>' + esc(next.title) +
            '<svg width="22" height="14" viewBox="0 0 22 14" fill="none"><path d="M1 7h19m0 0l-6-6m6 6l-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/></svg>' +
          '</h3>' +
          '<p>' + esc(next.lede) + '</p>' +
        '</div>' +
      '</a>' +
    '</section>';
  }

  function buildPager(proj, prev, next, all) {
    var idx = all.findIndex(function(p) { return p.notionId === proj.id; });
    var total = all.length;
    var counter = idx !== -1
      ? (String(idx + 1).padStart(2, '0') + ' / ' + String(total).padStart(2, '0'))
      : '';

    var prevLink = prev
      ? '<a href="case-study?id=' + esc(prev.notionId) + '" class="proj-pager__link proj-pager__link--prev">' +
          '<span class="proj-pager__arrow"><svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M15 6H1m0 0l5-5m-5 5l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/></svg></span>' +
          '<span class="proj-pager__meta">' +
            '<span class="proj-pager__label">Previous</span>' +
            '<span class="proj-pager__title">' + esc(prev.title) + '</span>' +
          '</span>' +
        '</a>'
      : '<span></span>';

    var nextLink = next
      ? '<a href="case-study?id=' + esc(next.notionId) + '" class="proj-pager__link proj-pager__link--next">' +
          '<span class="proj-pager__meta">' +
            '<span class="proj-pager__label">Next</span>' +
            '<span class="proj-pager__title">' + esc(next.title) + '</span>' +
          '</span>' +
          '<span class="proj-pager__arrow"><svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M1 6h14m0 0l-5-5m5 5l-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/></svg></span>' +
        '</a>'
      : '<span></span>';

    return '<nav class="proj-pager">' + prevLink + '<span class="proj-pager__index">' + counter + '</span>' + nextLink + '</nav>';
  }

  function buildByline(metrics) {
    if (!metrics || !metrics.length) return '';
    var blocks = metrics.slice(0, 3).map(function(m) {
      return '<div class="cs-hero__byline-block">' +
        '<h5>' + esc(m.label) + '</h5>' +
        '<span class="metric">' + esc(m.value) + '</span>' +
        (m.description ? '<p>' + esc(m.description) + '</p>' : '') +
      '</div>';
    }).join('');
    return '<div class="cs-hero__byline">' + blocks + '</div>';
  }

  function getNext(currentId, all) {
    var idx = all.findIndex(function(p) { return p.notionId === currentId; });
    if (idx === -1) return all[0] || null;
    var next = all[(idx + 1) % all.length];
    return next.notionId === currentId ? null : next;
  }

  function getPrev(currentId, all) {
    var idx = all.findIndex(function(p) { return p.notionId === currentId; });
    if (idx === -1) return null;
    if (idx === 0) return null;
    return all[idx - 1];
  }

  function esc(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }
})();
</script>

</body>
</html>
