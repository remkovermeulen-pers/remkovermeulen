name: Sync Notion Content

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install youtube-transcript-api

      - name: Fetch articles and projects from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          BRANDFETCH_KEY: ${{ secrets.BRANDFETCH_KEY }}
        run: node scripts/fetch-notion-articles.js

      - name: Enrich matched articles with YouTube transcripts
        run: python3 scripts/enrich-transcripts.py

      - name: Commit updated articles
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: sync articles and projects from Notion"
          git push
